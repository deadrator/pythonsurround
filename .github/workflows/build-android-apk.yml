name: Build Android APK

on:
  push:
    branches:
      - android
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, e.g. 1.0.3 (leave empty to read versionName from app/build.gradle.kts)"
        required: false
        default: ""
      arch:
        description: "Architecture suffix used in the beta release name. Note: the ffmpeg-kit AAR ships only 64-bit ABIs (arm64-v8a, x86_64), so this is a naming label, not a true 32-bit build."
        required: false
        default: "x64"
        type: choice
        options:
          - x64
          - x32

permissions:
  contents: write # needed to create GitHub Releases

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        working-directory: ./android
        run: chmod +x gradlew

      - name: Build debug APK
        working-directory: ./android
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: AtmosBinauralConverter-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      # ---------------- Publish beta preview to GitHub Releases ----------------
      - name: Resolve release version and arch
        id: release
        env:
          # User-supplied workflow_dispatch inputs are passed via env, never
          # interpolated into the script, to prevent shell injection.
          INPUT_ARCH: ${{ inputs.arch }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          ARCH="${INPUT_ARCH:-x64}"
          VERSION="$INPUT_VERSION"
          if [ -z "$VERSION" ]; then
            VERSION="$(grep -oP 'versionName\s*=\s*"\K[^"]+' android/app/build.gradle.kts | head -1)"
          fi
          VERSION="${VERSION:-1.0.0}"
          # Sanitize to a safe tag/output charset so a crafted input cannot
          # inject extra keys into GITHUB_OUTPUT or create a malformed tag.
          VERSION="$(printf '%s' "$VERSION" | tr -cd 'A-Za-z0-9._-')"
          VERSION="${VERSION:-1.0.0}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "arch=${ARCH}" >> "$GITHUB_OUTPUT"
          echo "Release: beta_preview_v${VERSION}_${ARCH}"

      - name: Publish beta preview release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ARCH: ${{ steps.release.outputs.arch }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          VERSION="$RELEASE_VERSION"
          ARCH="$RELEASE_ARCH"
          TAG="beta_preview_v${VERSION}_${ARCH}"
          ASSET="AtmosBinauralConverter-${TAG}.apk"
          cp android/app/build/outputs/apk/debug/app-debug.apk "$ASSET"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "⚠️ Release ${TAG} already exists - skipping (bump the version or delete the release to republish)."
          else
            NOTES="$(printf '🎧 Atmos Binaural Converter - Android beta preview (%s)\n- Commit: %s\n- APK: %s' "$ARCH" "$GITHUB_SHA" "$ASSET")"
            gh release create "$TAG" "$ASSET" \
              --title "$TAG" \
              --prerelease \
              --notes "$NOTES"
            echo "✅ Published release: ${TAG}"
          fi
