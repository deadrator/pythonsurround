version: 1

script:
  # Clean up and create directory structure
  - rm -rf AppDir | true
  - mkdir -p AppDir/usr/src
  - mkdir -p AppDir/usr/share/icons/hicolor/256x256/apps/
  - mkdir -p AppDir/usr/share/applications/
  
  # Copy source code
  - cp gui_app.py AppDir/usr/src/
  - cp convert_atmos.py AppDir/usr/src/
  - chmod +x AppDir/usr/src/gui_app.py
  
  # Create desktop entry
  - |
    cat > AppDir/usr/share/applications/atmos-converter.desktop << 'EOF'
    [Desktop Entry]
    Name=Atmos Binaural Converter
    Comment=Convert Dolby 5.1 to binaural stereo for headphones
    Exec=gui_app.py %F
    Icon=atmos-converter
    Terminal=false
    Type=Application
    Categories=AudioVideo;Audio;
    MimeType=audio/mpeg;audio/x-m4a;audio/flac;audio/wav;
    EOF
  
  # Create placeholder icon (PNG format)
  - python3 -c "
import struct, zlib
def create_png(width, height, color):
    def chunk(chunk_type, data):
        c = chunk_type + data
        return struct.pack('>I', len(data)) + c + struct.pack('>I', zlib.crc32(c) & 0xffffffff)
    header = b'\x89PNG\r\n\x1a\n'
    ihdr = chunk(b'IHDR', struct.pack('>IIBBBBB', width, height, 8, 2, 0, 0, 0))
    raw = b''
    for y in range(height):
        raw += b'\x00'
        for x in range(width):
            dx, dy = x - width//2, y - height//2
            dist = (dx*dx + dy*dy) ** 0.5
            if dist < width//2 - 10:
                if dist < width//4:
                    raw += bytes([15, 52, 96])
                elif dist < width//3:
                    raw += bytes([22, 33, 62])
                else:
                    raw += bytes([233, 69, 96])
            else:
                raw += bytes([26, 26, 46])
    idat = chunk(b'IDAT', zlib.compress(raw))
    iend = chunk(b'IEND', b'')
    return header + ihdr + idat + iend
with open('AppDir/usr/share/icons/hicolor/256x256/apps/atmos-converter.png', 'wb') as f:
    f.write(create_png(256, 256, (233, 69, 96)))
"

AppDir:
  path: ./AppDir
  
  app_info:
    id: com.atmos-converter.app
    name: Atmos Binaural Converter
    icon: atmos-converter
    version: 1.0.0
    exec: usr/src/gui_app.py
    exec_args: "$@"

  apt:
    arch: amd64
    sources:
      - sourceline: 'deb [arch=amd64] http://archive.ubuntu.com/ubuntu/ focal main restricted universe multiverse'
        key_url: 'http://keyserver.ubuntu.com/pks/lookup?op=get&search=0x3b4fe6acc0b21f32'
    include:
      - python3
      - python3-pip
      - python3-pkg-resources
      - python3-tk
      - python3-tcl
      - ffmpeg
    exclude: []

  runtime:
    env:
      PYTHONHOME: '${APPDIR}/usr'
      PYTHONPATH: '${APPDIR}/usr/lib/python3/dist-packages:${APPDIR}/usr/local/lib/python3/dist-packages'

AppImage:
  arch: x86_64
  sign-key: None
  update-information: None
